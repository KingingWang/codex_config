name: Release

# Build double-clickable GUI apps for macOS, Windows and Linux, then attach
# them to a GitHub Release.
#
# Trigger:
#   * push a tag like `v0.1.0`  -> builds + publishes a Release
#   * manual "Run workflow"     -> builds + uploads artifacts (no Release)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------- macOS
  macos:
    name: macOS (universal .dmg)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + both Apple targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build (Apple Silicon + Intel)
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

      - name: Assemble universal .app and .dmg
        run: |
          set -euxo pipefail
          APP="Codex 配置助手.app"
          MACOS="$APP/Contents/MacOS"
          RES="$APP/Contents/Resources"
          mkdir -p "$MACOS" "$RES"

          # Fuse the two arch binaries into one universal binary.
          lipo -create -output "$MACOS/codex-config" \
            target/aarch64-apple-darwin/release/codex-config \
            target/x86_64-apple-darwin/release/codex-config
          chmod +x "$MACOS/codex-config"

          cp assets/icon/icon.icns "$RES/icon.icns"

          VERSION="${GITHUB_REF_NAME#v}"
          [ "$VERSION" = "$GITHUB_REF_NAME" ] && VERSION="0.0.0-dev"
          sed 's/^ *//' > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Codex 配置助手</string>
            <key>CFBundleDisplayName</key><string>Codex 配置助手</string>
            <key>CFBundleIdentifier</key><string>com.kingingwang.codexconfig</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleExecutable</key><string>codex-config</string>
            <key>CFBundleIconFile</key><string>icon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>10.15</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

          # Ad-hoc sign so Gatekeeper on the same machine class is less noisy.
          codesign --force --deep --sign - "$APP" || true

          hdiutil create -volname "Codex 配置助手" -srcfolder "$APP" \
            -ov -format UDZO "codex-config-macos-universal.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: codex-config-macos-universal.dmg

  # ---------------------------------------------------------------- Windows
  windows:
    name: Windows (${{ matrix.arch }} .zip)
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Run non-GUI regressions
        run: cargo test --locked --target ${{ matrix.target }} --lib --test document --test persistence --test validation --test editor_preservation --test catalog --test editors --test remote --test remote_models --test ssh_config

      - name: Package .zip
        shell: pwsh
        run: |
          $dir = "codex-config-windows"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item target/${{ matrix.target }}/release/codex-config.exe "$dir/codex-config.exe"
          Copy-Item README.md "$dir/README.md"
          Compress-Archive -Path "$dir/*" -DestinationPath "codex-config-windows-${{ matrix.arch }}.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip-${{ matrix.arch }}
          path: codex-config-windows-${{ matrix.arch }}.zip
          if-no-files-found: error

  # ---------------------------------------------------------------- Linux
  linux:
    name: Linux (${{ matrix.arch }} .AppImage)
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - arch: aarch64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    # Keep both architectures on Ubuntu 22.04 for the same glibc baseline.
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install GUI build/runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libxkbcommon-dev libwayland-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb-icccm4-dev libxcb-keysyms1-dev libssl-dev \
            libfuse2 fuse

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Run non-GUI regressions
        run: cargo test --locked --target ${{ matrix.target }} --lib --test document --test persistence --test validation --test editor_preservation --test catalog --test editors --test remote --test remote_models --test ssh_config

      - name: Assemble AppDir and build AppImage
        run: |
          set -euxo pipefail
          APPDIR=AppDir
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/applications" \
                   "$APPDIR/usr/share/icons/hicolor/256x256/apps"

          cp target/${{ matrix.target }}/release/codex-config "$APPDIR/usr/bin/codex-config"
          cp packaging/codex-config.desktop "$APPDIR/usr/share/applications/codex-config.desktop"
          cp packaging/codex-config.desktop "$APPDIR/codex-config.desktop"
          cp assets/icon/icon-256.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/codex-config.png"
          cp assets/icon/icon-256.png "$APPDIR/codex-config.png"

          sed 's/^ *//' > "$APPDIR/AppRun" <<'SH'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/codex-config" "$@"
          SH
          chmod +x "$APPDIR/AppRun"

          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.arch }}.AppImage -O appimagetool
          chmod +x appimagetool
          ARCH=${{ matrix.arch }} ./appimagetool --appimage-extract-and-run "$APPDIR" codex-config-linux-${{ matrix.arch }}.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage-${{ matrix.arch }}
          path: codex-config-linux-${{ matrix.arch }}.AppImage
          if-no-files-found: error

  # ---------------------------------------------------------------- Release
  release:
    name: Publish GitHub Release
    needs: [macos, windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create / update the Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/macos-dmg/codex-config-macos-universal.dmg
            dist/windows-zip-x64/codex-config-windows-x64.zip
            dist/windows-zip-arm64/codex-config-windows-arm64.zip
            dist/linux-appimage-x86_64/codex-config-linux-x86_64.AppImage
            dist/linux-appimage-aarch64/codex-config-linux-aarch64.AppImage
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            # Codex 配置助手 ${{ github.ref_name }}

            ## 本次更新

            - 新增 Linux aarch64 与 Windows ARM64 的 ARM 原生构建，原有 x86_64 / macOS 通用包不变。
            - 全新石墨灰工作台：统一排版、间距、控件和蓝色强调，精简视觉装饰。
            - 首页环境与配置概览，模型和权限自适应分栏；1000×660 小窗口也能访问全部导航与主要操作。
            - 紧凑的模型、服务商和配置档列表，长名称与路径可悬停查看；选中模型只编辑，启用需明确操作。
            - 源文件编辑支持 TOML 语法高亮、独立错误滚动区与清晰的应用/保存提示；JSON 保持纯文本编辑。
            - 保留本地与 SSH 配置功能、备份、冲突检测及草稿保护；配置格式不变，无新增依赖。
            - 170 项测试通过，1 项个人配置测试默认跳过；已验证 Linux 原生桌面启动与截图，Windows / macOS 视觉效果仍需实机验证。

            聊天测试可能产生少量费用，取消等待不会撤销已发送的请求。
            服务商请求保留 HTTPS 证书校验、不跟随重定向，不回传原始响应正文或环境变量密钥。

            远程功能需要本机 OpenSSH 8.7+、密钥 / agent 登录和已信任的主机指纹；
            远端需 Linux / macOS 和 Python 3.7+。暂不支持密码交互、远程 Windows 或远程重启。
            本地编辑不需要 Python，也不会自动连接 SSH 主机。

            ## 下载

            双击即可运行的图形化 Codex 配置编辑器。请按你的系统下载:

            | 系统 | 下载 | 使用方法 |
            |------|------|----------|
            | **macOS**（Intel + Apple Silicon 通用）| `codex-config-macos-universal.dmg` | 打开 dmg，把 App 拖进「应用程序」。首次打开若提示未验证开发者，右键点图标选「打开」。 |
            | **Windows 10/11 (x64，Intel / AMD)** | `codex-config-windows-x64.zip` | 解压后双击 `codex-config.exe`。SmartScreen 提示时点「更多信息 → 仍要运行」。 |
            | **Windows 11 (ARM64)** | `codex-config-windows-arm64.zip` | 解压后双击 `codex-config.exe`；适用于 ARM 设备。 |
            | **Linux (x86_64)** | `codex-config-linux-x86_64.AppImage` | `chmod +x` 后运行；需要系统图形库和 FUSE，详见 README。 |
            | **Linux (aarch64 / ARM64)** | `codex-config-linux-aarch64.AppImage` | `chmod +x` 后运行；需要系统图形库和 FUSE，详见 README。 |
